[build]
  publish = "."
  functions = "netlify/functions"

# Sitemap dinâmico (com suporte a Google News para artigos das últimas 48h)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Card de compartilhamento (título + resumo + imagem) para WhatsApp/Facebook/X/LinkedIn
[[redirects]]
  from = "/s/:id"
  to = "/.netlify/functions/share?id=:id"
  status = 200

# Imagem de capa servida como JPEG (para og:image)
[[redirects]]
  from = "/img/:id"
  to = "/.netlify/functions/og-image?id=:id"
  status = 200

# LINKS ANTIGOS já divulgados nas redes: artigo.html?id=art-123... -> 301 para /artigo/nome-da-materia
[[redirects]]
  from = "/artigo.html"
  query = {id = ":id"}
  to = "/.netlify/functions/legacy?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/artigo"
  query = {id = ":id"}
  to = "/.netlify/functions/legacy?id=:id"
  status = 200
  force = true

# Endereço novo: qualquer /artigo/nome-da-materia abre a página do artigo
[[redirects]]
  from = "/artigo/*"
  to = "/artigo.html"
  status = 200

# Feed RSS dos artigos (fonte da newsletter automática)
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200
  force = true

# ads.txt do AdSense: texto puro, sempre atualizado e nunca interceptado por outra regra
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
