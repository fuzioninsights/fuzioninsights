[build]
  publish = "."
  functions = "netlify/functions"

# Card de compartilhamento (título + resumo + imagem)
[[redirects]]
  from = "/s/:id"
  to = "/.netlify/functions/share?id=:id"
  status = 200

[[redirects]]
  from = "/img/:id"
  to = "/.netlify/functions/og-image?id=:id"
  status = 200

# Sitemap gerado automaticamente com todos os artigos
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
